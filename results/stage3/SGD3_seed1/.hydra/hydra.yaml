hydra:
  run:
    dir: ${logdir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - train.n_train_itr=140
    - train.save_model_freq=35
    - wandb=null
    - seed=1
    - logdir=/soalnas/share/data/zbao7/diffusion_policy/results/stage3/SGD3_seed1
    - model.clip_ploss_coef=1e6
    - model.clip_ploss_coef_base=1e6
    - train.target_kl=null
    - +model.clamp_logprob=false
    - model.randn_clip_value=100
    - +train.actor_single_step=true
    - +model.actor_loss=score
    - +train.stage3_diag=true
    - +train.adv_estimator=mc_loo
    - +train.decision_discount=true
    - model.gamma_denoising=1.0
    - +model.logprob_reduce=sum
    - +model.norm_adv=false
    - +train.actor_optimizer=sgd
    - train.actor_lr=0.0003632170702457701
    - train.actor_lr_scheduler.min_lr=0.0003632170702457701
  job:
    name: run
    chdir: null
    override_dirname: +model.actor_loss=score,+model.clamp_logprob=false,+model.logprob_reduce=sum,+model.norm_adv=false,+train.actor_optimizer=sgd,+train.actor_single_step=true,+train.adv_estimator=mc_loo,+train.decision_discount=true,+train.stage3_diag=true,logdir=/soalnas/share/data/zbao7/diffusion_policy/results/stage3/SGD3_seed1,model.clip_ploss_coef=1e6,model.clip_ploss_coef_base=1e6,model.gamma_denoising=1.0,model.randn_clip_value=100,seed=1,train.actor_lr=0.0003632170702457701,train.actor_lr_scheduler.min_lr=0.0003632170702457701,train.n_train_itr=140,train.save_model_freq=35,train.target_kl=null,wandb=null
    id: ???
    num: ???
    config_name: ft_ppo_diffusion_mlp
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /soalnas/share/data/zbao7/diffusion_policy/results/stage3/dppo
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /soalnas/share/data/zbao7/diffusion_policy/results/stage3/dppo/cfg
      schema: file
      provider: main
    - path: /soalnas/share/data/zbao7/diffusion_policy/results/stage3/dppo/cfg/gym/finetune/halfcheetah-v2
      schema: file
      provider: command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: /soalnas/share/data/zbao7/diffusion_policy/results/stage3/SGD3_seed1
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
