hydra:
  run:
    dir: ${logdir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - train.n_train_itr=140
    - train.save_model_freq=35
    - wandb=null
    - model.randn_clip_value=100
    - +model.clamp_logprob=false
    - +train.mode=grad_mean
    - seed=101100
    - logdir=/soalnas/share/data/zbao7/diffusion_policy/results/stage3/gradmean/collect/P0_j11
    - base_policy_path=/soalnas/share/data/zbao7/diffusion_policy/results/repro_halfcheetah/dppo/log/gym-pretrain/halfcheetah-medium-v2_pre_diffusion_mlp_ta4_td20/2024-06-12_23-04-42/checkpoint/state_3000.pt
    - +train.gm_step=collect
    - +train.gm_point=P0
    - +train.gm_parent_commit=f425082723799776af35e100983fe20b86888a02
    - +train.gm_frozen_path=/soalnas/share/data/zbao7/diffusion_policy/results/stage3/gradmean/prepare/P0/frozen_P0.pt
    - +train.gm_frozen_sha256=beb93651fc7d5daec89a40be55484f30b2cecf53affb7b75ce890f07329ff951
    - +train.gm_batches=50
    - +train.gm_score_sample=0
  job:
    name: run
    chdir: null
    override_dirname: +model.clamp_logprob=false,+train.gm_batches=50,+train.gm_frozen_path=/soalnas/share/data/zbao7/diffusion_policy/results/stage3/gradmean/prepare/P0/frozen_P0.pt,+train.gm_frozen_sha256=beb93651fc7d5daec89a40be55484f30b2cecf53affb7b75ce890f07329ff951,+train.gm_parent_commit=f425082723799776af35e100983fe20b86888a02,+train.gm_point=P0,+train.gm_score_sample=0,+train.gm_step=collect,+train.mode=grad_mean,base_policy_path=/soalnas/share/data/zbao7/diffusion_policy/results/repro_halfcheetah/dppo/log/gym-pretrain/halfcheetah-medium-v2_pre_diffusion_mlp_ta4_td20/2024-06-12_23-04-42/checkpoint/state_3000.pt,logdir=/soalnas/share/data/zbao7/diffusion_policy/results/stage3/gradmean/collect/P0_j11,model.randn_clip_value=100,seed=101100,train.n_train_itr=140,train.save_model_freq=35,wandb=null
    id: ???
    num: ???
    config_name: ft_ppo_diffusion_mlp
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /soalnas/share/data/zbao7/diffusion_policy/results/stage3_gradmean/dppo
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /soalnas/share/data/zbao7/diffusion_policy/results/stage3_gradmean/dppo/cfg
      schema: file
      provider: main
    - path: /soalnas/share/data/zbao7/diffusion_policy/results/stage3_gradmean/dppo/cfg/gym/finetune/halfcheetah-v2
      schema: file
      provider: command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: /soalnas/share/data/zbao7/diffusion_policy/results/stage3/gradmean/collect/P0_j11
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
